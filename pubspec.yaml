name: gscappall
description: Local-first cross-platform Chinese poem learning app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  sqlite3: ^3.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_local_notifications: ^21.0.0
  just_audio: ^0.10.5
  record: ^6.2.0
  sherpa_onnx: ^1.12.39
  path: ^1.9.1
  path_provider: ^2.1.5
  timezone: ^0.11.0
  lpinyin: ^2.0.3
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/audio/
    - assets/images/
    - assets/speech/
    - assets/speech/sherpa_onnx_streaming_zipformer_zh_14m_2023_02_23/encoder-epoch-99-avg-1.int8.onnx
    - assets/speech/sherpa_onnx_streaming_zipformer_zh_14m_2023_02_23/decoder-epoch-99-avg-1.onnx
    - assets/speech/sherpa_onnx_streaming_zipformer_zh_14m_2023_02_23/joiner-epoch-99-avg-1.int8.onnx
    - assets/speech/sherpa_onnx_streaming_zipformer_zh_14m_2023_02_23/tokens.txt
